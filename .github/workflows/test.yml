name: CI Pipeline

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test with Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - stable
          - oldstable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Go dependencies
        if: hashFiles('go.mod') != ''
        run: go mod download

      - name: Check Go formatting
        if: hashFiles('go.mod') != ''
        run: test -z "$(gofmt -l .)"

      - name: Check Go licenses
        if: hashFiles('go.mod') != ''
        run: |
          go list -m all | awk '/^[^ ]+\// { print $1 }' | sort -u > /tmp/first-party-modules.txt
          go list -m -json all | while IFS= read -r module; do
            module_path=$(printf '%s' "$module" | sed -E 's/^[[:space:]]*"module"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
            if [[ -n "$module_path" ]] && ! grep -Fxq "$module_path" /tmp/first-party-modules.txt; then
              module_origin=$(printf '%s' "$module" | sed -E 's/^[[:space:]]*"origin"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
              if [[ "$module_origin" != https://proxy.golang.org/* && "$module_origin" != https://sum.golang.org/* ]]; then
                echo "::error::Go module $module_path has no origin metadata"
                exit 1
              fi
            fi
          done

      - name: Check Go formatting
        if: hashFiles('go.mod') != ''
        run: test -z "$(gofmt -l .)"

      - name: Check Go licenses
        if: hashFiles('go.mod') != ''
        run: |
          go list -m all | awk '/^[^ ]+\// { print $1 }' | sort -u > /tmp/first-party-modules.txt
          go list -m -json all | while IFS= read -r module; do
            module_path=$(printf '%s' "$module" | sed -E 's/^[[:space:]]*"module"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
            if [[ -n "$module_path" ]] && ! grep -Fxq "$module_path" /tmp/first-party-modules.txt; then
              module_origin=$(printf '%s' "$module" | sed -E 's/^[[:space:]]*"origin"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
              if [[ "$module_origin" != https://proxy.golang.org/* && "$module_origin" != https://sum.golang.org/* ]]; then
                echo "::error::Go module $module_path has no origin metadata"
                exit 1
              fi
            fi
          done

      - name: Build Go package
        if: hashFiles('go.mod') != ''
        run: go build ./...

      - name: Typecheck Go package
        if: hashFiles('go.mod') != ''
        run: go test -run '^$' ./...

      - name: Run Go tests
        if: hashFiles('go.mod') != ''
        run: go test ./...

      - name: Write pipeline summary
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup-go.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LICENSES_OUTCOME: ${{ steps.licenses.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          outcome() {
            case "$1" in
              success) printf 'Success' ;;
              failure) printf 'Failed' ;;
              skipped) printf 'Skipped' ;;
              cancelled) printf 'Cancelled' ;;
              neutral) printf 'Neutral' ;;
              *) printf 'Unknown' ;;
            esac
          }
          {
            printf '## Go %s pipeline\n\n' '${{ matrix.go-version }}'
            printf '| Step | Outcome |\n| --- | --- |\n'
            printf '| Checkout | %s |\n' "$(outcome "$CHECKOUT_OUTCOME")"
            printf '| Go setup | %s |\n' "$(outcome "$GO_SETUP_OUTCOME")"
            printf '| Dependencies | %s |\n' "$(outcome "$DEPS_OUTCOME")"
            printf '| Format | %s |\n' "$(outcome "$FORMAT_OUTCOME")"
            printf '| License check | %s |\n' "$(outcome "$LICENSES_OUTCOME")"
            printf '| Build | %s |\n' "$(outcome "$BUILD_OUTCOME")"
            printf '| Typecheck | %s |\n' "$(outcome "$TYPECHECK_OUTCOME")"
            printf '| Tests | %s |\n' "$(outcome "$TEST_OUTCOME")"
          } >> "$GITHUB_STEP_SUMMARY"
